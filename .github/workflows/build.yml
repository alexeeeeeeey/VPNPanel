name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Check installer
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...

  release:
    name: Publish release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate version tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            suffix=""
            if [ "$GOOS" = windows ]; then suffix=".exe"; fi
            for command in vpnpanel vpnpanelctl; do
              go build -trimpath \
                -ldflags "-s -w -X vpnpanel/internal/buildinfo.Version=$VERSION" \
                -o "dist/$command-$GOOS-$GOARCH$suffix" "./cmd/$command"
            done
          done
          cd dist
          cp ../install.sh install.sh
          sha256sum vpnpanel-* vpnpanelctl-* install.sh > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* --verify-tag --draft --generate-notes --title "$VERSION"
          gh release edit "$VERSION" --draft=false --latest
